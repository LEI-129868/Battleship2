# LEI-129822 - Ricardo Paiva

name: Qodana - 129822 - Long Parameter List

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  long-parameter-list:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Analisar Long Parameter List
        uses: JetBrains/qodana-action@v2026.2.2
        with:
          args: --config qodana-129822.yaml
          pr-mode: false
          post-pr-comment: false
          upload-result: true
          artifact-name: qodana-129822-long-parameter-list
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_420625068 }}
