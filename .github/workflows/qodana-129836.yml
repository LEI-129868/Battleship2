
# 129836 - Tomás Costa
name: Qodana - Long Method - 129836

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana-long-method:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Long Method Analysis
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-12345.yaml
          use-annotations: true
          post-pr-comment: true
          upload-result: true