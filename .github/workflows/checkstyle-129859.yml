# LEI-129859 - Daniel Silva
name: Checkstyle - 129859 - MemberName

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  checkstyle-129859:
    name: checkstyle-129859
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkstyle MemberName
        uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129859.xml
          reporter: github-pr-check
          level: error
          filter_mode: added
          fail_level: error
