# LEI-129868 - Francisco Silva

name: Checkstyle - LEI-129868 - MethodName

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  checkstyle-129868:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run java checkstyle
        uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          checkstyle_config: checkstyle-129868.xml
          workdir: src/main
          reporter: github-check
          level: error
          filter_mode: added
          fail_level: error
          reviewdog_flags: -name=checkstyle-report-129868