# 129859 - Daniel Silva
profile:
  base:
    name: Default

  inspections:
    - group: ALL
      enabled: false

    - inspection: MethodCount
      enabled: true
      severity: ERROR
      ignore:
        - "!src/**/*.java"
      options:
        m_limit: 30
        ignoreGettersAndSetters: false
        ignoreOverridingMethods: false