# Messages in English
menu.title=***  Battleship  ***
menu.prompt=>\ 
menu.goodbye=Fair winds!
menu.unknown_command=What command is that??? Try again ...
menu.help.header======================== MENU HELP ============================
menu.help.instructions=Type one of the commands below to interact with the game:
menu.help.gerafrota=- {0}: Generates a random fleet of ships.
menu.help.lefrota=- {0}: Allows creating and loading a custom fleet.
menu.help.status=- {0}: Shows current fleet status.
menu.help.mapa=- {0}: Displays the fleet map.
menu.help.rajada=- {0}: Fires a volley of shots.
menu.help.simula=- {0}: Simulates a full game.
menu.help.tiros=- {0}: Lists valid shots made (* = hit on ship, o = water miss)
menu.help.idioma=- {0} [pt|en]: Changes game language (Portuguese / English).
menu.help.desistir=- {0}: Quits the game.
menu.help.footer================================================================
menu.lang_changed=Language changed to: {0}

