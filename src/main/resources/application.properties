# Battleship REST Opponent Server configuration

# Port the server listens on (change if 8080 is taken)
server.port=8080

# Pretty-print JSON responses ? easier for students to read
spring.jackson.serialization.indent-output=true

# Suppress the Spring Boot banner for cleaner output (optional)
spring.main.banner-mode=off

# Log level ? set to DEBUG to see all HTTP requests
logging.level.root=INFO
logging.level.battleship=DEBUG